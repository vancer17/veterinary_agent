# =============================================================================
# 文件: docker/compose.dev.yml
# 作用: 编排兽医 Agent 开发环境运行拓扑。
# 范围: 支持本地源码挂载、开发镜像构建、数据库初始化和真实中间件链路。
# 说明: 开发环境可构建镜像；正式环境只能使用已发布的预编译镜像。
# =============================================================================

# 开发环境默认读取 *.env.template；复制为同名 *.env 后可覆盖本机端口与密钥。
x-postgres-env-files: &postgres-env-files
  - path: ./postgres/template/postgres.dev.env.template
    required: true
  - path: ./postgres/template/postgres.dev.env
    required: false

x-litellm-env-files: &litellm-env-files
  - path: ./litellm/template/litellm.dev.env.template
    required: true
  - path: ./litellm/template/litellm.dev.env
    required: false

x-mem0-env-files: &mem0-env-files
  - path: ./mem0/template/mem0.dev.env.template
    required: true
  - path: ./mem0/template/mem0.dev.env
    required: false

x-mem0-dashboard-env-files: &mem0-dashboard-env-files
  - path: ./mem0-dashboard/template/mem0-dashboard.dev.env.template
    required: true
  - path: ./mem0-dashboard/template/mem0-dashboard.dev.env
    required: false

x-opa-env-files: &opa-env-files
  - path: ./opa/template/opa.dev.env.template
    required: true
  - path: ./opa/template/opa.dev.env
    required: false

x-app-env-files: &app-env-files
  - path: ./app/template/app.dev.env.template
    required: true
  - path: ./app/template/app.dev.env
    required: false

x-app-build: &app-build
  context: ..
  dockerfile: docker/app/Dockerfile.dev
  args:
    PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-ghcr.io/astral-sh/uv:python3.12-bookworm}

x-mem0-build: &mem0-build
  context: ..
  dockerfile: docker/mem0/Dockerfile
  args:
    # Mem0 服务镜像基于 git submodule 中的 vendor/mem0/server 多阶段构建。
    PYTHON_BASE_IMAGE: ${MEM0_PYTHON_BASE_IMAGE:-python:3.12-slim-bookworm}
    # 将子模块提交写入镜像元数据，便于从运行镜像反查对应上游源码版本。
    MEM0_SOURCE_COMMIT: ${MEM0_SOURCE_COMMIT:-unknown}

x-mem0-dashboard-build: &mem0-dashboard-build
  context: ..
  dockerfile: docker/mem0-dashboard/Dockerfile
  args:
    # Mem0 运维 Dashboard 基于 git submodule 中的 vendor/mem0/server/dashboard 多阶段构建。
    NODE_BASE_IMAGE: ${MEM0_DASHBOARD_NODE_BASE_IMAGE:-node:20-bookworm-slim}
    # 将子模块提交写入镜像元数据，便于从运行镜像反查对应上游源码版本。
    MEM0_SOURCE_COMMIT: ${MEM0_SOURCE_COMMIT:-unknown}

x-opa-build: &opa-build
  context: ..
  dockerfile: docker/opa/Dockerfile
  args:
    # OPA 官方 Release 版本；开发环境可覆盖验证新版本兼容性。
    OPA_VERSION: ${OPA_VERSION:-v1.19.0}
    # OPA Runtime 基础镜像；仅用于本地开发构建，不影响生产预编译镜像。
    OPA_RUNTIME_BASE_IMAGE: ${OPA_RUNTIME_BASE_IMAGE:-debian:bookworm-slim}

name: ${COMPOSE_PROJECT_NAME:-vet-agent-dev}

services:
  postgres:
    image: ${PGVECTOR_IMAGE:-pgvector/pgvector:pg16}
    container_name: vet-agent-dev-postgres
    restart: unless-stopped
    shm_size: "${POSTGRES_SHM_SIZE:-256mb}"
    env_file: *postgres-env-files
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - vet_agent_dev_pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: ${POSTGRES_HEALTHCHECK_INTERVAL:-5s}
      timeout: ${POSTGRES_HEALTHCHECK_TIMEOUT:-5s}
      retries: ${POSTGRES_HEALTHCHECK_RETRIES:-20}

  postgres-extensions:
    image: ${PGVECTOR_IMAGE:-pgvector/pgvector:pg16}
    container_name: vet-agent-dev-postgres-extensions
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    env_file: *postgres-env-files
    volumes:
      - ./postgres/ops/ensure-extensions.sh:/usr/local/bin/ensure-postgres-extensions:ro
      - ./postgres/ops/vector-smoke-check.sh:/usr/local/bin/postgres-vector-smoke-check:ro
    # 显式通过 bash 调用挂载脚本，避免宿主机文件执行位异常导致一次性运维任务失败。
    command: ["bash", "-c", "bash /usr/local/bin/ensure-postgres-extensions && bash /usr/local/bin/postgres-vector-smoke-check"]

  litellm:
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm-database:1.96.0}
    container_name: vet-agent-dev-litellm
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: *litellm-env-files
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    volumes:
      - ./litellm/litellm.yml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "${LITELLM_WORKERS:-2}"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/readiness', timeout=3).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 30

  mem0:
    image: ${MEM0_IMAGE:-vet-agent-mem0:dev}
    build: *mem0-build
    container_name: vet-agent-dev-mem0
    restart: unless-stopped
    depends_on:
      litellm:
        condition: service_healthy
      postgres-extensions:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    env_file: *mem0-env-files
    ports:
      - "${MEM0_PORT:-8001}:8000"
    volumes:
      - vet_agent_dev_mem0_history:/app/history
      - ./mem0/application.yml:/app/config/application.yml:ro

  mem0-dashboard:
    image: ${MEM0_DASHBOARD_IMAGE:-vet-agent-mem0-dashboard:dev}
    build: *mem0-dashboard-build
    container_name: vet-agent-dev-mem0-dashboard
    restart: unless-stopped
    depends_on:
      mem0:
        condition: service_healthy
    env_file: *mem0-dashboard-env-files
    ports:
      - "${MEM0_DASHBOARD_PORT:-3001}:3000"
    volumes:
      - ./mem0-dashboard/application.yml:/app/config/application.yml:ro

  opa:
    image: ${OPA_IMAGE:-vet-agent-opa:dev}
    build: *opa-build
    container_name: vet-agent-dev-opa
    restart: unless-stopped
    init: true
    env_file: *opa-env-files
    ports:
      - "${OPA_PORT:-8181}:8181"
      - "${OPA_DIAGNOSTIC_PORT:-8282}:8282"
    volumes:
      - ./opa/application.yml:/opa/config/application.yml:ro
      - ./opa/policies:/opa/policies:ro
      - vet_agent_dev_opa_persistence:/opa/persistence
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8282/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  app:
    image: ${VET_AGENT_IMAGE:-vet-agent:dev}
    build: *app-build
    container_name: vet-agent-dev-app
    restart: unless-stopped
    depends_on:
      postgres-extensions:
        condition: service_completed_successfully
      litellm:
        condition: service_healthy
      mem0:
        condition: service_healthy
      opa:
        condition: service_healthy
    env_file: *app-env-files
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ..:/app
    command: >
      sh -c "alembic upgrade head
      && if [ \"$${SEED_WITH_EMBEDDINGS:-false}\" = \"true\" ]; then
      python scripts/seed_database.py --with-embeddings;
      else
      python scripts/seed_database.py;
      fi
      && uvicorn vet_agent.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    image: ${VET_AGENT_IMAGE:-vet-agent:dev}
    build: *app-build
    container_name: vet-agent-dev-worker
    restart: unless-stopped
    init: true
    depends_on:
      app:
        condition: service_healthy
    env_file: *app-env-files
    volumes:
      - ..:/app
    # 开发环境 worker 复用同一套源码挂载与应用镜像，仅切换为后台任务入口。
    command: ["python", "-m", "vet_agent.background_tasks.worker"]
    healthcheck:
      # worker 不提供 HTTP 接口，健康检查直接校验后台任务仓储可访问性。
      test: ["CMD-SHELL", "python -m vet_agent.background_tasks.healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  vet_agent_dev_pgdata:
  vet_agent_dev_mem0_history:
  vet_agent_dev_opa_persistence:
