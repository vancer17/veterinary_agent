# =============================================================================
# 文件: docker/postgres/postgresql.conf
# 作用: 定义 PostgreSQL + pgvector 共享数据库实例的非敏感运行参数。
# 范围: 覆盖监听、连接数、内存、查询超时、WAL、日志与 pgvector 检索相关基础参数。
# 说明: 本文件由开发与正式 Compose 挂载；账号、密码和逻辑库名称仍由 env 文件注入。
# =============================================================================

# 监听所有容器网络地址；生产环境是否对外暴露由 Docker Compose 端口映射控制。
listen_addresses = '*'

# PostgreSQL 容器内部端口；Compose 对外端口映射不在此处配置。
port = 5432

# 最大数据库连接数；需覆盖 app、LiteLLM、Mem0、运维任务和短时连接峰值。
max_connections = 100

# 共享缓冲区；当前单机初版保持保守值，避免小规格服务器内存压力过高。
shared_buffers = 256MB

# 单个排序、Hash、聚合操作的工作内存；过大时会按并发查询倍增。
work_mem = 16MB

# 建索引、VACUUM 等维护操作内存；HNSW 索引构建会受该值影响。
maintenance_work_mem = 256MB

# 查询规划器估算可用系统缓存；用于影响索引扫描和顺序扫描选择。
effective_cache_size = 768MB

# 随机页读取代价；容器部署通常运行在 SSD 或云盘上，保持较低估值。
random_page_cost = 1.1

# 单条 SQL 最大执行时间，单位毫秒；避免异常向量检索或文本相似度查询长期占用连接。
statement_timeout = 30000

# 空闲事务最大保留时间，单位毫秒；防止应用异常后长期持有锁。
idle_in_transaction_session_timeout = 30000

# 锁等待超时时间，单位毫秒；迁移或运维操作遇到长锁时应快速失败。
lock_timeout = 10000

# WAL 单次检查点间隔；初版保持稳健，减少频繁 checkpoint 带来的写入抖动。
checkpoint_timeout = 10min

# WAL 最大体积；需覆盖 seed、向量导入和 Mem0 批量写入带来的短时峰值。
max_wal_size = 2GB

# WAL 最小保留体积；避免频繁回收造成重复分配。
min_wal_size = 256MB

# 自动清理开关；RAG、记忆和请求日志表均依赖 autovacuum 维护统计信息和膨胀控制。
autovacuum = on

# 输出连接断开日志；便于排查连接池、重启和网络问题。
log_disconnections = on

# 输出慢 SQL；正式环境可根据业务压力调整阈值。
log_min_duration_statement = 1000

# 日志行前缀包含时间、进程、用户、数据库、客户端和应用名，便于多服务共库排障。
log_line_prefix = '%m [%p] user=%u db=%d app=%a client=%h '
