# =============================================================================
# 文件: docker/nginx/vhost/mem0-dashboard.vet-agent.conf
# 作用: Mem0 Dashboard 运维面板的反向代理配置。
# 范围: 暴露 Mem0 Dashboard Web 界面，支持记忆可视化管理与监控。
# 说明: 本配置用于开发与生产环境；Dashboard 提供记忆数据的可视化操作界面。
# =============================================================================

# Mem0 Dashboard Web 界面统一入口；提供记忆管理、检索测试与系统监控功能。
server {
    listen 80;
    # 生产环境建议绑定具体域名；开发环境可使用通配符或 IP 地址访问。
    server_name mem0-dashboard.vet-agent.local;

    # 访问日志记录客户端请求信息，便于后续审计与问题排查。
    access_log /www/wwwlogs/mem0-dashboard-access.log;
    # 错误日志记录代理层与上游服务的异常信息。
    error_log /www/wwwlogs/mem0-dashboard-error.log warn;

    # 客户端请求体大小限制；Dashboard 前端上传文件或提交表单时需适当调高。
    client_max_body_size 5m;
    # 客户端请求体缓冲区大小。
    client_body_buffer_size 64k;

    # Dashboard 前端静态资源与 API 代理主入口。
    location / {
        # 上游服务地址；Mem0 Dashboard 容器监听宿主机 3001 端口（容器内 3000 端口映射）。
        proxy_pass http://127.0.0.1:3001;

        # 透传客户端真实 IP 地址到上游服务。
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js 开发服务器支持热更新，需启用 WebSocket 连接。
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 静态资源缓存策略；生产环境可启用，开发环境建议禁用以便实时查看变更。
        # add_header Cache-Control "public, max-age=3600";

        # 上游连接超时配置；前端资源加载与 API 请求超时时间。
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Next.js 热更新 WebSocket 端点；开发模式下前端代码变更后自动刷新页面。
    location /_next/webpack-hmr {
        proxy_pass http://127.0.0.1:3001/_next/webpack-hmr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # 热更新连接需要保持长连接，禁用超时。
        proxy_read_timeout 86400s;
    }

    # Dashboard 静态资源路径；Next.js 编译后的 JS、CSS、图片等资源。
    location /_next/static {
        proxy_pass http://127.0.0.1:3001/_next/static;
        proxy_set_header Host $host;
        # 静态资源启用浏览器缓存，减少重复请求。
        add_header Cache-Control "public, max-age=31536000, immutable";
        # 静态资源访问不记录日志，减少日志文件大小。
        access_log off;
    }

    # Dashboard 公共资源路径；存放 favicon、manifest 等前端资源。
    location /public {
        proxy_pass http://127.0.0.1:3001/public;
        proxy_set_header Host $host;
        # 公共资源启用短期缓存。
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }

    # Mem0 后端 API 代理路径；前端通过此路径调用 Mem0 记忆服务。
    # 该路径对应 Dashboard application.yml 中的 public_api_url 配置。
    location /api/mem0/ {
        # 代理到 Mem0 服务的宿主机端口，去除 /api/mem0 前缀。
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 跨域请求头配置；允许 Dashboard 前端跨域访问 Mem0 后端。
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Max-Age 3600 always;

        # 处理预检请求（OPTIONS）；浏览器在跨域请求前会先发送 OPTIONS 预检。
        if ($request_method = OPTIONS) {
            return 204;
        }

        # API 请求禁用缓存，确保数据实时性。
        proxy_buffering off;
        proxy_cache off;

        # Mem0 API 请求超时配置；向量检索可能耗时较长。
        proxy_connect_timeout 30s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # Dashboard 自身 API 代理路径；前端通过此路径调用 Dashboard Next.js API 路由。
    location /api {
        proxy_pass http://127.0.0.1:3001/api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # API 请求禁用缓存，确保数据实时性。
        proxy_buffering off;
        proxy_cache off;

        # API 请求超时配置。
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
