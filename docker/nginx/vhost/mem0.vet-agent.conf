# =============================================================================
# 文件: docker/nginx/vhost/mem0.vet-agent.conf
# 作用: Mem0 记忆管理服务的反向代理配置。
# 范围: 暴露 Mem0 API 端点，支持记忆存储、检索与管理操作。
# 说明: 本配置用于开发与生产环境；Mem0 服务提供 Agent 记忆持久化能力。
# =============================================================================

# Mem0 API 统一入口；提供记忆增删改查与向量检索接口。
server {
    listen 80;
    # 生产环境建议绑定具体域名；开发环境可使用通配符或 IP 地址访问。
    server_name mem0.vet-agent.local;

    # 访问日志记录客户端请求信息，便于后续审计与问题排查。
    access_log /www/wwwlogs/mem0-access.log;
    # 错误日志记录代理层与上游服务的异常信息。
    error_log /www/wwwlogs/mem0-error.log warn;

    # 客户端请求体大小限制；Mem0 接收记忆文本与向量数据时需适当调高。
    client_max_body_size 10m;
    # 客户端请求体缓冲区大小。
    client_body_buffer_size 128k;

    # Mem0 API 主入口；承载记忆 CRUD、向量检索与配置管理等核心接口。
    location / {
        # 上游服务地址；Mem0 容器监听宿主机 8001 端口（容器内 8000 端口映射）。
        proxy_pass http://127.0.0.1:8001;

        # 透传客户端真实 IP 地址到上游服务，便于 Mem0 记录调用来源。
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 向量检索可能返回较大结果集，禁用代理缓冲以支持流式响应。
        proxy_buffering off;
        proxy_cache off;

        # 上游连接超时配置；向量检索与批量操作耗时较长，需适当延长超时时间。
        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;

        # WebSocket 支持；部分客户端可能使用 WebSocket 连接。
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 健康检查端点；用于负载均衡器或监控系统探测服务可用性。
    location /health {
        proxy_pass http://127.0.0.1:8001/health;
        proxy_set_header Host $host;
        # 健康检查请求不记录访问日志，避免日志文件膨胀。
        access_log off;
    }

    # API 文档端点；Mem0 提供 OpenAPI 规范文档与交互式 API 浏览器。
    location /docs {
        proxy_pass http://127.0.0.1:8001/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # OpenAPI JSON 规范端点；用于客户端自动生成 SDK 或集成到 API 网关。
    location /openapi.json {
        proxy_pass http://127.0.0.1:8001/openapi.json;
        proxy_set_header Host $host;
        # OpenAPI 规范访问频率较低，不记录访问日志。
        access_log off;
    }
}
