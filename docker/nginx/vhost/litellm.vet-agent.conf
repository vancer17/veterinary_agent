# =============================================================================
# 文件: docker/nginx/vhost/litellm.vet-agent.conf
# 作用: LiteLLM 模型网关服务的反向代理配置。
# 范围: 暴露 LiteLLM API 端点与 Admin UI，支持 WebSocket 连接与流式响应。
# 说明: 本配置用于开发与生产环境；通过域名或路径前缀区分访问入口。
# =============================================================================

# LiteLLM API 与 Admin UI 统一入口；根据路径前缀路由到不同功能模块。
server {
    listen 80;
    # 生产环境建议绑定具体域名；开发环境可使用通配符或 IP 地址访问。
    server_name litellm.vet-agent.local;

    # 访问日志记录客户端请求信息，便于后续审计与问题排查。
    access_log /www/wwwlogs/litellm-access.log;
    # 错误日志记录代理层与上游服务的异常信息。
    error_log /www/wwwlogs/litellm-error.log warn;

    # 客户端请求体大小限制；LiteLLM 接收大型 prompt 时需适当调高。
    client_max_body_size 10m;
    # 客户端请求体缓冲区大小。
    client_body_buffer_size 128k;

    # LiteLLM API 主入口；承载模型调用、健康检查、指标暴露等核心接口。
    location / {
        # 上游服务地址；LiteLLM 容器监听宿主机 4000 端口。
        proxy_pass http://127.0.0.1:4000;

        # 透传客户端真实 IP 地址到上游服务，便于 LiteLLM 记录调用来源。
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 流式响应支持；LiteLLM 返回 SSE 流时需禁用缓冲。
        proxy_buffering off;
        proxy_cache off;

        # 上游连接超时配置；模型推理耗时较长，需适当延长超时时间。
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # WebSocket 支持；LiteLLM Admin UI 与部分客户端可能使用 WebSocket 连接。
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 健康检查端点；用于负载均衡器或监控系统探测服务可用性。
    location /health {
        proxy_pass http://127.0.0.1:4000/health;
        proxy_set_header Host $host;
        # 健康检查请求不记录访问日志，避免日志文件膨胀。
        access_log off;
    }

    # Prometheus 指标端点；用于监控系统采集 LiteLLM 运行时指标。
    location /metrics {
        proxy_pass http://127.0.0.1:4000/metrics;
        proxy_set_header Host $host;
        # 指标采集频率较高，不记录访问日志。
        access_log off;
    }
}
