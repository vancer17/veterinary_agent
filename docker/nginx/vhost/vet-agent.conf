# =============================================================================
# 文件: docker/nginx/vhost/vet-agent.conf
# 作用: Veterinary Agent 统一服务入口配置。
# 范围: 通过路径前缀路由到 LiteLLM、Mem0、Mem0 Dashboard 三个核心服务。
# 说明: 统一使用 80 端口，避免多域名配置；适用于开发与生产环境。
# =============================================================================

# Veterinary Agent 统一服务入口；通过路径前缀区分不同服务。
server {
    listen 80;
    # 使用专用域名；避免与其他站点冲突。
    server_name vet-agent.local;

    # 统一访问日志；记录所有服务的请求信息。
    access_log /www/wwwlogs/vet-agent-access.log;
    # 统一错误日志；记录代理层与上游服务的异常信息。
    error_log /www/wwwlogs/vet-agent-error.log warn;

    # 客户端请求体大小限制；兼容 LiteLLM 大型 prompt 与 Mem0 向量数据。
    client_max_body_size 10m;
    # 客户端请求体缓冲区大小。
    client_body_buffer_size 128k;

    # =============================================================================
    # LiteLLM 模型网关服务入口
    # 路径前缀: /litellm/
    # 上游端口: 4000
    # =============================================================================

    # LiteLLM API 主入口；承载模型调用、Admin UI、健康检查等核心接口。
    location /litellm/ {
        # 代理到 LiteLLM 服务，去除 /litellm 前缀。
        proxy_pass http://127.0.0.1:4000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 流式响应支持；LiteLLM 返回 SSE 流时需禁用缓冲。
        proxy_buffering off;
        proxy_cache off;

        # 上游连接超时配置；模型推理耗时较长，需适当延长超时时间。
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # WebSocket 支持；LiteLLM Admin UI 与部分客户端可能使用 WebSocket 连接。
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # LiteLLM 健康检查端点；用于负载均衡器或监控系统探测服务可用性。
    location /litellm/health {
        proxy_pass http://127.0.0.1:4000/health;
        proxy_set_header Host $host;
        # 健康检查请求不记录访问日志，避免日志文件膨胀。
        access_log off;
    }

    # LiteLLM Prometheus 指标端点；用于监控系统采集运行时指标。
    location /litellm/metrics {
        proxy_pass http://127.0.0.1:4000/metrics;
        proxy_set_header Host $host;
        # 指标采集频率较高，不记录访问日志。
        access_log off;
    }

    # =============================================================================
    # Mem0 记忆管理服务入口
    # 路径前缀: /mem0/
    # 上游端口: 8001
    # =============================================================================

    # Mem0 API 主入口；承载记忆 CRUD、向量检索与配置管理等核心接口。
    location /mem0/ {
        # 代理到 Mem0 服务，去除 /mem0 前缀。
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 向量检索可能返回较大结果集，禁用代理缓冲以支持流式响应。
        proxy_buffering off;
        proxy_cache off;

        # 上游连接超时配置；向量检索与批量操作耗时较长，需适当延长超时时间。
        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;

        # WebSocket 支持；部分客户端可能使用 WebSocket 连接。
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Mem0 健康检查端点；用于负载均衡器或监控系统探测服务可用性。
    location /mem0/health {
        proxy_pass http://127.0.0.1:8001/health;
        proxy_set_header Host $host;
        # 健康检查请求不记录访问日志，避免日志文件膨胀。
        access_log off;
    }

    # Mem0 API 文档端点；提供 OpenAPI 规范文档与交互式 API 浏览器。
    location /mem0/docs {
        proxy_pass http://127.0.0.1:8001/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Mem0 OpenAPI JSON 规范端点；用于客户端自动生成 SDK 或集成到 API 网关。
    location /mem0/openapi.json {
        proxy_pass http://127.0.0.1:8001/openapi.json;
        proxy_set_header Host $host;
        # OpenAPI 规范访问频率较低，不记录访问日志。
        access_log off;
    }

    # =============================================================================
    # Mem0 Dashboard 专用 API 代理路径
    # 路径前缀: /api/mem0/
    # 上游端口: 8001
    # 说明: Dashboard 前端通过此路径调用 Mem0 后端，已配置 CORS 跨域支持。
    # =============================================================================

    # Dashboard 访问 Mem0 API 的专用路径；配置 CORS 允许跨域请求。
    location /api/mem0/ {
        # 代理到 Mem0 服务，去除 /api/mem0 前缀。
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 跨域请求头配置；允许 Dashboard 前端跨域访问 Mem0 后端。
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Max-Age 3600 always;

        # 处理预检请求（OPTIONS）；浏览器在跨域请求前会先发送 OPTIONS 预检。
        if ($request_method = OPTIONS) {
            return 204;
        }

        # API 请求禁用缓存，确保数据实时性。
        proxy_buffering off;
        proxy_cache off;

        # Mem0 API 请求超时配置；向量检索可能耗时较长。
        proxy_connect_timeout 30s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # =============================================================================
    # Mem0 Dashboard 前端服务入口
    # 路径前缀: / (根路径)
    # 上游端口: 3001
    # 说明: Dashboard 作为主入口，提供记忆可视化管理与监控功能。
    # =============================================================================

    # Next.js 热更新 WebSocket 端点；开发模式下前端代码变更后自动刷新页面。
    location /_next/webpack-hmr {
        proxy_pass http://127.0.0.1:3001/_next/webpack-hmr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # 热更新连接需要保持长连接，禁用超时。
        proxy_read_timeout 86400s;
    }

    # Dashboard 静态资源路径；Next.js 编译后的 JS、CSS、图片等资源。
    location /_next/static {
        proxy_pass http://127.0.0.1:3001/_next/static;
        proxy_set_header Host $host;
        # 静态资源启用浏览器缓存，减少重复请求。
        add_header Cache-Control "public, max-age=31536000, immutable";
        # 静态资源访问不记录日志，减少日志文件大小。
        access_log off;
    }

    # Dashboard 公共资源路径；存放 favicon、manifest 等前端资源。
    location /public {
        proxy_pass http://127.0.0.1:3001/public;
        proxy_set_header Host $host;
        # 公共资源启用短期缓存。
        add_header Cache-Control "public, max-age=3600";
        access_log off;
    }

    # Dashboard 自身 API 代理路径；前端通过此路径调用 Dashboard Next.js API 路由。
    location /api {
        proxy_pass http://127.0.0.1:3001/api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # API 请求禁用缓存，确保数据实时性。
        proxy_buffering off;
        proxy_cache off;

        # API 请求超时配置。
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Dashboard 前端静态资源与主入口；Next.js 服务器渲染页面与前端资源。
    location / {
        # 上游服务地址；Mem0 Dashboard 容器监听宿主机 3001 端口（容器内 3000 端口映射）。
        proxy_pass http://127.0.0.1:3001;

        # 透传客户端真实 IP 地址到上游服务。
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js 开发服务器支持热更新，需启用 WebSocket 连接。
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 静态资源缓存策略；生产环境可启用，开发环境建议禁用以便实时查看变更。
        # add_header Cache-Control "public, max-age=3600";

        # 上游连接超时配置；前端资源加载与 API 请求超时时间。
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
