# =============================================================================
# 文件: docker/compose.yml
# 作用: 编排兽医 Agent 正式环境运行拓扑。
# 范围: 只拉取并运行 GitHub Release 标签对应的预编译镜像，不声明 build。
# 说明: 生产镜像由 CD 根据 Release tag 注入 core 版 VET_AGENT_IMAGE、MEM0_IMAGE、MEM0_DASHBOARD_IMAGE 与 OPA_IMAGE。
# =============================================================================

name: ${COMPOSE_PROJECT_NAME:-vet-agent-prod}

# 正式环境真实 *.env 文件由人工或 GitHub Environment 安全下发；模板只提供可审查结构。
x-postgres-env-files: &postgres-env-files
  - path: ./postgres/template/postgres.prod.env.template
    required: true
  - path: ./postgres/template/postgres.prod.env
    required: false

x-litellm-env-files: &litellm-env-files
  - path: ./litellm/template/litellm.prod.env.template
    required: true
  - path: ./litellm/template/litellm.prod.env
    required: false

x-mem0-env-files: &mem0-env-files
  - path: ./mem0/template/mem0.prod.env.template
    required: true
  - path: ./mem0/template/mem0.prod.env
    required: false

x-mem0-dashboard-env-files: &mem0-dashboard-env-files
  - path: ./mem0-dashboard/template/mem0-dashboard.prod.env.template
    required: true
  - path: ./mem0-dashboard/template/mem0-dashboard.prod.env
    required: false

x-opa-env-files: &opa-env-files
  - path: ./opa/template/opa.prod.env.template
    required: true
  - path: ./opa/template/opa.prod.env
    required: false

x-app-env-files: &app-env-files
  - path: ./app/template/app.prod.env.template
    required: true
  - path: ./app/template/app.prod.env
    required: false

x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-20m}
    max-file: ${LOG_MAX_FILE:-5}

x-app-common: &app-common
  image: ${VET_AGENT_IMAGE:?请通过 GitHub Release 标签注入 VET_AGENT_IMAGE}
  env_file: *app-env-files
  networks:
    - backend
  logging: *default-logging

services:
  postgres:
    image: ${PGVECTOR_IMAGE:-pgvector/pgvector:pg16}
    restart: unless-stopped
    shm_size: "${POSTGRES_SHM_SIZE:-256mb}"
    env_file: *postgres-env-files
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: ${POSTGRES_HEALTHCHECK_INTERVAL:-10s}
      timeout: ${POSTGRES_HEALTHCHECK_TIMEOUT:-5s}
      retries: ${POSTGRES_HEALTHCHECK_RETRIES:-30}
    networks:
      - backend
    logging: *default-logging

  postgres-extensions:
    image: ${PGVECTOR_IMAGE:-pgvector/pgvector:pg16}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    env_file: *postgres-env-files
    volumes:
      - ./postgres/ops/ensure-extensions.sh:/usr/local/bin/ensure-postgres-extensions:ro
      - ./postgres/ops/vector-smoke-check.sh:/usr/local/bin/postgres-vector-smoke-check:ro
    # 显式通过 bash 调用挂载脚本，避免宿主机文件执行位异常导致一次性运维任务失败。
    command: ["bash", "-c", "bash /usr/local/bin/ensure-postgres-extensions && bash /usr/local/bin/postgres-vector-smoke-check"]
    networks:
      - backend
    logging: *default-logging

  litellm:
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm-database:1.96.0}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: *litellm-env-files
    volumes:
      - ./litellm/litellm.yml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "${LITELLM_WORKERS:-2}"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/readiness', timeout=3).read()\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 30
    networks:
      - backend
    logging: *default-logging

  mem0:
    image: ${MEM0_IMAGE:?请通过 GitHub Release 标签注入 MEM0_IMAGE}
    restart: unless-stopped
    depends_on:
      litellm:
        condition: service_healthy
      postgres-extensions:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    env_file: *mem0-env-files
    volumes:
      - mem0_history:/app/history
      - ./mem0/application.yml:/app/config/application.yml:ro
    networks:
      - backend
    logging: *default-logging

  mem0-dashboard:
    image: ${MEM0_DASHBOARD_IMAGE:?请通过 GitHub Release 标签注入 MEM0_DASHBOARD_IMAGE}
    restart: unless-stopped
    profiles: ["ops"]
    depends_on:
      mem0:
        condition: service_healthy
    env_file: *mem0-dashboard-env-files
    ports:
      - "127.0.0.1:${MEM0_DASHBOARD_PORT:-3001}:3000"
    volumes:
      - ./mem0-dashboard/application.yml:/app/config/application.yml:ro
    networks:
      - backend
    logging: *default-logging

  opa:
    image: ${OPA_IMAGE:?请通过 GitHub Release 标签注入 OPA_IMAGE}
    restart: unless-stopped
    init: true
    env_file: *opa-env-files
    ports:
      - "127.0.0.1:${OPA_PORT:-8181}:8181"
      - "127.0.0.1:${OPA_DIAGNOSTIC_PORT:-8282}:8282"
    volumes:
      - opa_persistence:/opa/persistence
      - ./opa/application.yml:/opa/config/application.yml:ro
      - ./opa/policies:/opa/policies:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8282/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 30
    networks:
      - backend
    logging: *default-logging

  migrate:
    <<: *app-common
    restart: "no"
    depends_on:
      postgres-extensions:
        condition: service_completed_successfully
    command: ["sh", "-c", "python -m vet_agent.runtime.offline_startup && alembic upgrade head"]
    profiles: ["ops"]

  seed:
    <<: *app-common
    restart: "no"
    depends_on:
      postgres-extensions:
        condition: service_completed_successfully
      litellm:
        condition: service_healthy
    command: >
      sh -c 'python -m vet_agent.runtime.offline_startup &&
      review_status="$${CLINICAL_SAFETY_REVIEW_STATUS:-approved}";
      if [ "$${SEED_WITH_EMBEDDINGS:-false}" = "true" ]; then
      python scripts/seed_database.py --with-embeddings --clinical-safety-review-status "$${review_status}";
      else
      python scripts/seed_database.py --clinical-safety-review-status "$${review_status}";
      fi'
    profiles: ["ops"]

  app:
    <<: *app-common
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_healthy
      mem0:
        condition: service_healthy
      opa:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:8000"
    command: ["app"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 30

  worker:
    <<: *app-common
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    # 后台 worker 复用正式应用镜像，只覆盖启动命令；生产环境不得现场构建第二套 worker 镜像。
    command: ["worker"]
    healthcheck:
      # worker 不暴露 HTTP 端口，健康状态以 PostgreSQL 后台任务表可访问性为准。
      test: ["CMD-SHELL", "python -m vet_agent.background_tasks.healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 30

networks:
  backend:

volumes:
  postgres_data:
  mem0_history:
  opa_persistence:
