# =============================================================================
# 文件: docker/litellm.yml
# 作用: 配置 LiteLLM Proxy 使用的通义千问对话、视觉与 embedding 模型。
# 范围: 只描述非敏感模型路由；API key、master key 与数据库连接由 env 文件注入。
# 说明: 开发与正式 Compose 共用本配置，环境差异由各自的 LiteLLM env 文件提供。
# =============================================================================

model_list:
  - model_name: qwen-plus
    litellm_params:
      model: openai/qwen-plus
      api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: os.environ/DASHSCOPE_API_KEY

  - model_name: qwen-vl-plus
    litellm_params:
      model: openai/qwen-vl-plus
      api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: os.environ/DASHSCOPE_API_KEY

  - model_name: text-embedding-v4
    litellm_params:
      model: openai/text-embedding-v4
      api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: os.environ/DASHSCOPE_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

litellm_settings:
  request_timeout: 60
  drop_params: true
