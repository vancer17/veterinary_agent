# =============================================================================
# 文件: pyproject.toml
# 作用: 定义兽医 Agent Python 包元信息、依赖解析源与测试基础配置。
# 范围: 作为 uv、setuptools 与 pytest 的统一项目配置入口。
# 说明: 依赖解析默认使用清华 PyPI 镜像，以匹配当前生产与 CI 网络环境。
# =============================================================================

[project]
name = "agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.17.2",
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "litellm==1.96.2",
    "llama-index-core>=0.14.23",
    "llama-index-vector-stores-postgres>=0.8.1",
    "pgvector>=0.4.2",
    "psycopg[binary]>=3.3.2",
    "pytest>=9.0.2",
    "sqlalchemy>=2.0.45",
    "uvicorn>=0.51.0",
]

[project.optional-dependencies]
guardrails = [
    # Guardrails 仅作为镜像变体 extra 安装；默认 core 镜像不携带该重依赖。
    "guardrails-ai==0.10.2",
    "guardrails-ai-prompt-injection-detector==0.0.2",
    "guardrails-ai-detect-pii==0.0.6",
    "guardrails-ai-detect-system-prompt-leakage==0.1.0",
    "guardrails-ai-mentions-drugs==0.1.0",
    "guardrails-ai-regex-match==0.1.0",
    "guardrails-ai-restrict-to-topic==0.1.0",
    "guardrails-ai-secrets-present==0.1.0",
    "guardrails-ai-valid-length==0.1.0",
    "nltk==3.10.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[[tool.uv.index]]
url = "https://pypi.org/simple"

[[tool.uv.index]]
# 将 uv 依赖解析与锁文件生成固定到清华 PyPI 镜像，匹配当前国内服务器网络环境。
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# pytest 仅收集本仓库测试，避免把 vendor 子模块的上游测试作为业务门禁。
pythonpath = ["src", "."]
testpaths = ["tests"]
norecursedirs = [".git", ".venv", "vendor"]
markers = [
    "integration: 需要真实 OPA、真实模型网关或其他外部服务的集成测试。",
]
