# =============================================================================
# 文件: pyproject.toml
# 作用: 定义兽医 Agent Python 包元信息、依赖解析源与测试基础配置。
# 范围: 作为 uv、setuptools 与 pytest 的统一项目配置入口。
# 说明: 依赖解析默认使用清华 PyPI 镜像，以匹配当前生产与 CI 网络环境。
# =============================================================================

[project]
name = "agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.17.2",
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "instructor>=1.15.4",
    "litellm==1.96.2",
    "llama-index-core>=0.14.23",
    "llama-index-vector-stores-postgres>=0.8.1",
    "pgvector>=0.4.2",
    "psycopg[binary]>=3.3.2",
    "pytest>=9.0.2",
    "sqlalchemy>=2.0.45",
    "uvicorn>=0.51.0",
]

[project.optional-dependencies]
guardrails = [
    # Guardrails 仅作为镜像变体 extra 安装；默认 core 镜像不携带该重依赖。
    "guardrails-ai==0.10.2",
    "guardrails-ai-prompt-injection-detector==0.0.2",
    "guardrails-ai-detect-pii==0.0.6",
    "guardrails-ai-detect-system-prompt-leakage==0.1.0",
    "guardrails-ai-mentions-drugs==0.1.0",
    "guardrails-ai-regex-match==0.1.0",
    "guardrails-ai-restrict-to-topic==0.1.0",
    "guardrails-ai-secrets-present==0.1.0",
    "guardrails-ai-valid-length==0.1.0",
    "nltk==3.10.3",
]
v8 = [
    # V8 shadow 快速验证 extras。Torch CPU wheel 由下方 PyTorch CPU index 固定。
    "httpx[socks]==0.28.1",
    "torch==2.8.0+cpu; sys_platform == 'linux'",
    "transformers==4.55.4",
    "gliner==0.2.28",
    "huggingface_hub[cli]==0.36.0",
    "seqeval==1.2.2",
    "instructor==1.15.4",
    "openai==2.54.0",
    "litellm==1.96.2",
    "baml-py==0.226.1",
]
v8-optimize = [
    "dspy==3.3.1",
]
v10-refine = [
    # V10 SPANMARKER-CHINESE supervised boundary refinement experiments.
    # Keep this separate from the V8 core extra to avoid pulling training
    # dependencies into the baseline shadow environment.
    "span-marker==1.8.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[[tool.uv.index]]
# 将 uv 依赖解析与锁文件生成固定到清华 PyPI 镜像，匹配当前国内服务器网络环境。
name = "tsinghua"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[[tool.uv.index]]
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
# vendor 是第三方源码；baml_client 由 baml-cli 生成，二者不进入仓库格式门禁。
extend-exclude = [
    "vendor",
    "src/vet_agent/input_preprocessing/baml_client",
]

[tool.mypy]
# Generated BAML Python is intentionally excluded from source typing gates.
exclude = "^src/vet_agent/input_preprocessing/baml_client/"

[tool.pytest.ini_options]
# pytest 仅收集本仓库测试，避免把 vendor 子模块的上游测试作为业务门禁。
pythonpath = ["src", "."]
testpaths = ["tests"]
norecursedirs = [".git", ".venv", "vendor"]
markers = [
    "integration: 需要真实 OPA、真实模型网关或其他外部服务的集成测试。",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.3",
]
